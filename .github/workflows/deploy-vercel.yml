# Deploy the GitHub source to Vercel without depending on Vercel's GitHub App.
# VERCEL_TOKEN is an encrypted repository secret, never committed to source.
# Public project identifiers live in GitHub repository variables.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: vercel-production
      url: ${{ steps.deployment.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@64.2.0
      - name: Pull production project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build for Vercel
        # Unlike Pages, Vercel serves FlowType at the domain root.
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BASE_PATH: /
      - name: Deploy production build
        id: deployment
        shell: bash
        run: |
          # Deploy only the verified output, outside the Git checkout. Otherwise
          # the CLI asks the expired Vercel GitHub connection to validate commit
          # authors, despite this workflow authenticating with the owner's token.
          # Preserve source provenance as ordinary deployment metadata instead.
          deploy_dir="$RUNNER_TEMP/flowtype-production"
          mkdir -p "$deploy_dir/.vercel"
          cp .vercel/project.json "$deploy_dir/.vercel/project.json"
          cp -R .vercel/output "$deploy_dir/.vercel/output"
          url=$(vercel deploy "$deploy_dir" --prebuilt --prod --token="$VERCEL_TOKEN" \
            --meta sourceRepository="$GITHUB_REPOSITORY" \
            --meta sourceCommit="$GITHUB_SHA")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### FlowType deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "[$url]($url)" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
