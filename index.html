<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta
      name="description"
      content="Find your rhythm with FlowType. A calm, beautifully focused typing test with personal insights, five natural themes, and no account required."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FlowType — Find your rhythm</title>
    <script>
      // Apply the validated appearance before styles load; blocked storage is harmless.
      try {
        const saved = JSON.parse(
          localStorage.getItem("flowtype.settings.v1") || "null",
        );
        if (
          saved &&
          ["light", "dark", "pastel", "sunset", "ocean"].includes(saved.theme)
        )
          document.documentElement.dataset.theme = saved.theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
